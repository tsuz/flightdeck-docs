<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="url(#skyGrad)" stroke="#0f3460" stroke-width="3"/>
  <!-- Airplane silhouette -->
  <g transform="translate(100,95)" fill="#e94560">
    <!-- Fuselage -->
    <path d="M0,-55 L8,-30 L8,25 L20,50 L-20,50 L-8,25 L-8,-30 Z" opacity="0.95"/>
    <!-- Wings -->
    <path d="M-8,-5 L-55,20 L-55,28 L-8,12 Z" opacity="0.9"/>
    <path d="M8,-5 L55,20 L55,28 L8,12 Z" opacity="0.9"/>
    <!-- Tail wings -->
    <path d="M-8,35 L-28,50 L-28,55 L-8,45 Z" opacity="0.85"/>
    <path d="M8,35 L28,50 L28,55 L8,45 Z" opacity="0.85"/>
    <!-- Cockpit window -->
    <path d="M-4,-45 L4,-45 L5,-35 L-5,-35 Z" fill="#4fc3f7" opacity="0.9"/>
  </g>
  <!-- HUD / dashboard lines -->
  <g stroke="#4fc3f7" stroke-width="1.2" fill="none" opacity="0.5">
    <!-- Horizon line -->
    <line x1="30" y1="100" x2="75" y2="100"/>
    <line x1="125" y1="100" x2="170" y2="100"/>
    <!-- Pitch marks -->
    <line x1="55" y1="85" x2="75" y2="85"/>
    <line x1="125" y1="85" x2="145" y2="85"/>
    <line x1="55" y1="115" x2="75" y2="115"/>
    <line x1="125" y1="115" x2="145" y2="115"/>
  </g>
  <!-- Center crosshair -->
  <g stroke="#4fc3f7" stroke-width="1.5" fill="none" opacity="0.6">
    <circle cx="100" cy="100" r="4"/>
    <line x1="90" y1="100" x2="95" y2="100"/>
    <line x1="105" y1="100" x2="110" y2="100"/>
  </g>
</svg>
